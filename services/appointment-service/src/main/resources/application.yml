server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: appointment-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:appointment_db}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: ${DB_USER:clinic}
    password: ${DB_PASSWORD:clinic_pass}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-that-is-at-least-32-bytes-long!!}
    issuer: clinicscheduler
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  provider-service:
    base-url: ${PROVIDER_SERVICE_URL:http://localhost:8081}
    connect-timeout-ms: ${PROVIDER_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${PROVIDER_READ_TIMEOUT_MS:5000}
