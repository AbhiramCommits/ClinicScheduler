name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [provider-service, appointment-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify (unit + MockMvc + Testcontainers + JaCoCo)
        run: ./mvnw -B verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports-${{ matrix.service }}
          path: |
            services/${{ matrix.service }}/target/surefire-reports
            services/${{ matrix.service }}/target/failsafe-reports
            services/${{ matrix.service }}/target/site/jacoco
          if-no-files-found: warn

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (ChromeHeadless, coverage)
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm test -- --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Production build
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: web/coverage
          if-no-files-found: warn

  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Build and start the full stack
        run: docker compose up -d --build

      - name: Smoke test login -> search -> book -> duplicate 409
        run: ./scripts/smoke.sh

      - name: Collect compose logs
        if: always()
        run: docker compose logs --no-color > compose.log || true

      - name: Upload compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose.log
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: docker compose down -v
