services:
  mysql:
    image: mysql:8.0
    container_name: clinicscheduler-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-clinic_root}
      MYSQL_USER: ${DB_USER:-clinic}
      MYSQL_PASSWORD: ${DB_PASSWORD:-clinic_pass}
      MYSQL_DATABASE: provider_db
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-clinic_root}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # provider-service and appointment-service are added in Step 7.

volumes:
  mysql-data:
